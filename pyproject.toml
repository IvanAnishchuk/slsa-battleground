[project]
name = "slsa-battleground"
version = "0.0.1"
description = "Minimal package for testing SLSA provenance in GitHub Actions"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.13"
authors = [{ name = "Ivan Anishchuk", email = "ivan@ivananishchuk.net" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/IvanAnishchuk/slsa-battleground"
Repository = "https://github.com/IvanAnishchuk/slsa-battleground"
Issues = "https://github.com/IvanAnishchuk/slsa-battleground/issues"
Changelog = "https://github.com/IvanAnishchuk/slsa-battleground/blob/main/CHANGELOG.md"
Security = "https://github.com/IvanAnishchuk/slsa-battleground/blob/main/SECURITY.md"

[project.scripts]
slsa-battleground = "slsa_battleground.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slsa_battleground"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "TRY",  # tryceratops
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess with validated input in fixtures
    "S607",   # partial executable path in test setup
    "BLE001", # broad Exception in test fixtures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=slsa_battleground",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-report=html:.reports/test/htmlcov",
    "--cov-report=xml:.reports/test/coverage.xml",
    "--junitxml=.reports/test/test-results.xml",
    "-ra",
]
junit_family = "xunit2"
junit_logging = "all"
junit_log_passing_tests = false

[tool.coverage.run]
source_pkgs = ["slsa_battleground"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
